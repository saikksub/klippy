name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the core
        run: cargo test -p shared
      - name: Build Klippy.exe
        run: cargo build -p klippy-windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Klippy-windows-x64
          path: target/release/Klippy.exe
