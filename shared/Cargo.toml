[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib", "staticlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["crux_core/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]

[dependencies]
# facet must stay pinned to the exact version crux_core uses
facet = "=0.46.5"
boltffi.workspace = true
crux_core.workspace = true
serde = { workspace = true, features = ["derive"] }

# codegen-only dependencies
anyhow = { workspace = true, optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
log = { version = "0.4", optional = true }
pretty_env_logger = { version = "0.5", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher"] }
ammonia = "4.2.4"
url = "2.5.8"
resvg = { version = "0.49.0", default-features = false, features = ["raster-images"] }
base64 = "0.23.1"
percent-encoding = "2.3.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
html5ever = "0.40"

[dev-dependencies]
crux_core = { workspace = true, features = ["testing"] }
