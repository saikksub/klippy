<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}'; style-src 'unsafe-inline'; img-src data:; frame-src about:">
<title>Klippy</title>
<style>{{CSS}}</style>
</head>
<body data-window="{{WINDOW}}" data-tab="{{TAB}}" data-version="{{VERSION}}">
<template id="app-icon">{{ICON}}</template>
<div id="root"></div>
<script nonce="{{NONCE}}">{{JS}}</script>
</body>
</html>
